<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/anchor.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchored OSS</title>
    <script>
      (() => {
        const key = "anchored_theme";
        const normalize = (value) => (value === "warm" ? "warm" : "light");
        let theme = "light";
        try {
          theme = normalize(localStorage.getItem(key));
        } catch {
          theme = "light";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === "warm" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
