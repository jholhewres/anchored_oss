name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frontend
        run: cd web && npm install --no-audit --no-fund && npm run build

      - name: Set variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          mkdir -p dist

          build_variant() {
            local MODE="$1"
            local SUFFIX="$2"
            local LDFLAGS="-s -w -X github.com/jholhewres/anchored_oss/internal/version.Version=${VERSION} -X github.com/jholhewres/anchored_oss/internal/config.DefaultMode=${MODE}"

            GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-linux-amd64" ./cmd/server
            GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-linux-arm64" ./cmd/server
            GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-darwin-amd64" ./cmd/server
            GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-darwin-arm64" ./cmd/server
          }

          build_variant selfhosted selfhosted
          build_variant cloud cloud

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/anchored-oss-*
            dist/checksums-sha256.txt
          body: |
            ## Anchored OSS ${{ steps.vars.outputs.version }}

            Two binary variants: **selfhosted** (single-tenant, default) and **cloud** (multi-tenant with registration).

            ### Install

            ```bash
            curl -fsSL https://anchoredoss.dev/install-oss | sh
            ```

            ### Binaries

            | Variant | Platform | Arch | Binary |
            |---|---|---|---|
            | Self-hosted | Linux | amd64 | `anchored-oss-selfhosted-linux-amd64` |
            | Self-hosted | Linux | arm64 | `anchored-oss-selfhosted-linux-arm64` |
            | Self-hosted | macOS | amd64 | `anchored-oss-selfhosted-darwin-amd64` |
            | Self-hosted | macOS | arm64 | `anchored-oss-selfhosted-darwin-arm64` |
            | Cloud | Linux | amd64 | `anchored-oss-cloud-linux-amd64` |
            | Cloud | Linux | arm64 | `anchored-oss-cloud-linux-arm64` |
            | Cloud | macOS | amd64 | `anchored-oss-cloud-darwin-amd64` |
            | Cloud | macOS | arm64 | `anchored-oss-cloud-darwin-arm64` |

            Built on ${{ steps.vars.outputs.build_date }} with Go 1.25 (CGO_ENABLED=0).
