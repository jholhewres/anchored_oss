name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frontend
        run: cd web && npm install --no-audit --no-fund && npm run build

      - name: Set variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          mkdir -p dist

          build_variant() {
            local MODE="$1"
            local SUFFIX="$2"
            local LDFLAGS="-s -w -X github.com/jholhewres/anchored_oss/internal/version.Version=${VERSION} -X github.com/jholhewres/anchored_oss/internal/config.DefaultMode=${MODE}"

            GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-linux-amd64" ./cmd/server
            GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-linux-arm64" ./cmd/server
            GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-darwin-amd64" ./cmd/server
            GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-darwin-arm64" ./cmd/server
            GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-windows-amd64.exe" ./cmd/server
            GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o "dist/anchored-oss-${SUFFIX}-windows-arm64.exe" ./cmd/server
          }

          # Only the self-hosted variant is published. The cloud build is a
          # private product and is not distributed from this repository.
          build_variant selfhosted selfhosted

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<'EOF'
          ## Anchored OSS ${{ steps.vars.outputs.version }}

          Self-hosted team memory sync for Anchored — open source, local-first, organization-owned.

          ### Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/jholhewres/anchored_oss/main/install/install.sh | sh
          ```

          The installer downloads the matching `selfhosted` asset below, installs it under
          `~/.anchored-oss`, and starts it with PM2. You can also build from source
          (`make build-prod`) or run via Docker Compose — see the README.

          ### Binaries

          | Platform | Arch | Binary |
          |---|---|---|
          | Linux | amd64 | `anchored-oss-selfhosted-linux-amd64` |
          | Linux | arm64 | `anchored-oss-selfhosted-linux-arm64` |
          | macOS | amd64 | `anchored-oss-selfhosted-darwin-amd64` |
          | macOS | arm64 | `anchored-oss-selfhosted-darwin-arm64` |
          | Windows | amd64 | `anchored-oss-selfhosted-windows-amd64.exe` |
          | Windows | arm64 | `anchored-oss-selfhosted-windows-arm64.exe` |

          Built on ${{ steps.vars.outputs.build_date }} with Go 1.25 (CGO_ENABLED=0).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A semver prerelease tag (contains a hyphen, e.g. v0.6.0-beta.1) is
          # published as a prerelease and never marked "Latest", so production
          # installers that follow releases/latest keep pinning the stable line.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            dist/anchored-oss-*
            dist/checksums-sha256.txt
          body_path: dist/release-notes.md

      # Skip the pinned-version bump for prereleases: the installer reads
      # VERSION.md to pin a stable version and must not be moved onto a beta.
      - name: Update VERSION.md on main
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Best-effort: the installer reads VERSION.md to pin a version, but it
          # also falls back to releases/latest, so a failure here is non-fatal.
          sha=$(gh api "repos/$REPO/contents/VERSION.md" --jq .sha 2>/dev/null || true)
          body=$(printf '%s\n' "$VERSION" | base64 -w0)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$REPO/contents/VERSION.md" \
              -f message="chore: update VERSION.md to $VERSION" \
              -f content="$body" -f sha="$sha" || true
          else
            gh api --method PUT "repos/$REPO/contents/VERSION.md" \
              -f message="chore: add VERSION.md for $VERSION" \
              -f content="$body" || true
          fi
