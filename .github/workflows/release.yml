name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frontend
        run: cd web && npm install --no-audit --no-fund && npm run build

      - name: Set variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          LDFLAGS: >-
            -s -w
            -X github.com/jholhewres/anchored_oss/internal/version.Version=${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist

          # linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/anchored-oss-linux-amd64 ./cmd/server

          # linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/anchored-oss-linux-arm64 ./cmd/server

          # darwin amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/anchored-oss-darwin-amd64 ./cmd/server

          # darwin arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/anchored-oss-darwin-arm64 ./cmd/server

          # windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/anchored-oss-windows-amd64.exe ./cmd/server

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/anchored-oss-*
            dist/checksums-sha256.txt
          body: |
            ## Anchored OSS ${{ steps.vars.outputs.version }}

            Self-hosted team memory sync server for Anchored.

            ### Quick Start
            ```bash
            # Download
            curl -sL https://github.com/jholhewres/anchored_oss/releases/download/${{ steps.vars.outputs.version }}/anchored-oss-linux-amd64 -o anchored-oss
            chmod +x anchored-oss

            # Run with Docker Compose (Postgres)
            docker compose up -d postgres
            ./anchored-oss -bootstrap
            ./anchored-oss
            ```

            ### Binaries
            | Platform | Architecture | Binary |
            |---|---|---|
            | Linux | amd64 | `anchored-oss-linux-amd64` |
            | Linux | arm64 | `anchored-oss-linux-arm64` |
            | macOS | amd64 | `anchored-oss-darwin-amd64` |
            | macOS | arm64 | `anchored-oss-darwin-arm64` |
            | Windows | amd64 | `anchored-oss-windows-amd64.exe` |

            Built on ${{ steps.vars.outputs.build_date }} with Go 1.25 (CGO_ENABLED=0).
