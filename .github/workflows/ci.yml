name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.25']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: cd web && npm install --no-audit --no-fund && npm run build
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -ldflags "-X github.com/jholhewres/anchored_oss/internal/version.Version=${VERSION}" ./cmd/server
      - run: go test -count=1 -race ./...

  # Postgres-backed store tests (//go:build integration), including the
  # Postgres twins (*_Postgres) of the SQLite store tests. The twins skip
  # without ANCHORED_TEST_DSN, so the job fails when one is skipped or none
  # ran.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anchored
          POSTGRES_PASSWORD: anchored
          POSTGRES_DB: anchored_oss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchored -d anchored_oss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANCHORED_TEST_DSN: postgres://anchored:anchored@localhost:5432/anchored_oss?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet -tags integration ./internal/store/... ./internal/curation/...
      - name: make test-integration
        run: |
          make test-integration GOTESTFLAGS=-v | tee integration.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -- '--- SKIP: .*_Postgres' integration.log; then
            echo "a Postgres twin was skipped"; exit 1
          fi
          grep -c -- '--- PASS: .*_Postgres' integration.log

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build server
